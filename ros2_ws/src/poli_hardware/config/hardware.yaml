# POLI 하드웨어 계층 파라미터 (조원 A)
# TODO_MEASURE = 조립 후 실측 필수, SIM_ONLY = 시뮬레이션용 임시값 (실기에 그대로 쓰지 말 것)
# 이 파일 변경은 코드 변경과 같은 수준으로 리뷰한다.
# 2026-10-29: RRC Lite -> MDD10 + Mega. 모터·엔코더·IMU 관련 값 일부(방향, 속도 제어 이득)는
#             Mega 펌웨어 config.h에 있다 (firmware/mega_sensor_controller/config.h).

# fake_mega_node / mega_bridge_node 공통
/**:
  ros__parameters:
    wheel_radius: 0.0325       # 65 mm 바퀴 기준. 직선 1~2 m 주행으로 보정 (TODO_MEASURE)
    wheel_separation: 0.279    # 바퀴 포함 폭 305 mm - 바퀴 폭 26 mm (2026-10-30 줄자). 제자리 회전으로 보정 (TODO_MEASURE)
    max_linear: 0.35           # m/s, 2026-10-31 0.25 -> 0.35 (임무 1 주행 속도). 초기 실내 제한 (무부하 이론 최고 약 1.12 m/s)
    max_angular: 1.5           # rad/s, 2026-10-31 1.0 -> 1.5 (임무 1 회전 1.2 rad/s)
    max_wheel_rpm: 250.0       # JGB37-520 정격 부하 250 RPM (무부하 330). 제품 사양서_E: 연속 주행은 정격 부근
    min_wheel_speed: 0.08      # m/s. 2026-10-31 0.25 -> 0.08 (MDD10 저속 가능, 급출발·급정지 해결). 0 = 끔. 이보다 느린 바퀴 명령은 두 바퀴를 같은 비율로 키움
                               # RRC 공장 펌웨어 PWM 25 % 미만 컷 때문에 도입 (2026-10-08). 제자리 회전도 약 2.8 rad/s
                               # ⚠ poli_navigation turn_pulse.HW_MIN_WHEEL_SPEED와 같아야 한다 (담당 1)
                               # TODO_MEASURE: MDD10 + Mega 속도 제어는 저속도 될 수 있다. 0.1·0.15 m/s가 부드러우면
                               #   담당 1과 함께 값을 낮추거나 끈다 (이 파일만 바꾸지 말 것)
    cmd_timeout: 0.3           # s, /cmd_vel 끊기면 0 속도 (권장 0.2~0.5). Mega 펌웨어도 0.3 s 뒤 스스로 정지
    odom_rate: 25.0            # Hz, $DRV 전송 주기와 같다
    imu_rate: 25.0             # Hz, Mega $IMU 주기와 같다
    odom_frame: odom
    base_frame: base_link
    imu_frame: imu_link
    median_window: 3           # 초음파 중간값 필터 (홀수, 1 = 끔). 튀는 값 제거, 지연 약 0.125 s
    field_of_view: 0.26        # rad, HC-SR04 약 15도
    min_range: 0.02
    max_range: 4.0

mega_bridge_node:
  ros__parameters:
    port: /dev/robot_mega      # udev 별칭 (docs/udev_template.md)
    baud: 115200               # docs/serial_protocol.md v2.0
    open_delay: 2.0            # 포트 열면 Mega 자동 리셋
    stale_timeout: 1.0         # s, RNG 끊김 경고
    motor_ticks_per_rev: 1320.0  # 바퀴 1회전 엔코더 tick = 30:1 x 11PPR x 4체배 (펌웨어가 4체배로 셈)
                               # TODO_MEASURE: drive_test wheel --revs 10 (PPR 12 변형이면 1440)
    encoder_timeout: 0.2       # s, $ENC(50 Hz)가 끊기면 바퀴 속도 0으로 봄
    imu_timeout: 0.5           # s, $IMU가 끊기면 /imu/data는 휠 각속도로 대신
    publish_imu: false         # /imu/data는 imu_node(MPU6050)가 발행 (2026-10-30). Mega $IMU·휠 각속도 대신 안 냄
    ack_timeout: 0.5           # s, $GRIP 응답 대기 (최대 3번 전송)

# MPU6050 (GY-521) -> /imu/data. 파이 소프트웨어 I2C 버스 3 (15번 SDA, 16번 SCL), VCC 17번 3.3V
# 3번 핀(하드웨어 I2C SDA)이 다른 용도로 사용 중이라서 (docs/pin_map.md 3장)
# 필요: /boot/firmware/config.txt 에 dtoverlay=i2c-gpio,bus=3,i2c_gpio_sda=22,i2c_gpio_scl=23
imu_node:
  ros__parameters:
    i2c_bus: 3
    i2c_address: 104           # 0x68 (AD0 = GND). AD0을 3.3V에 연결하면 105 (0x69)
    imu_rate: 50.0             # Hz
    imu_frame: imu_link        # 장착 위치·방향은 URDF imu_x/imu_y/imu_h/imu_yaw (TODO_MEASURE)
    gyro_range_dps: 500        # 제자리 회전 약 160 deg/s -> ±500 이면 여유
    accel_range_g: 4
    dlpf: 3                    # 내장 저역 필터 약 44 Hz
    calib_samples: 100         # 시작 후 2 s 가만히 두는 동안 자이로 영점
    calib_still_rad_s: 0.05    # 영점 중 이보다 크게 흔들리면 다시 잼
    gyro_variance: 0.001       # SIM_ONLY: 정지 상태 분산 실측 후 교체 (TODO_MEASURE)
    accel_variance: 0.01       # SIM_ONLY (TODO_MEASURE)

fake_mega_node:
  ros__parameters:
    fake_range: 2.0            # SIM_ONLY
    range_rate: 8.0
    fake_gripper_move_s: 1.0   # SIM_ONLY: 집게 이동 시간 (임무 노드 GRASP_WAIT_S 1.5 s 안)
